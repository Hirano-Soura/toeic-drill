<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOEIC 単語ドリル</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--ink:#1f2430;--sub:#6b7280;--accent:#2563eb;--ok:#16a34a;--ng:#dc2626;--line:#e5e7eb;--star:#f59e0b;--mark:#fef3c7}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;position:sticky;top:0;z-index:5}
  header h1{margin:0;font-size:18px}
  nav{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  nav button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 14px;cursor:pointer;font-size:13px}
  nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  /* 【項目31】select の幅は最長の選択肢で決まる。上限を付けないと、
     「復習ミックス（今日／1日前／…）」のような長いラベル1つで画面幅を超え、
     スマホで横スクロールが発生する。flex-wrap は要素を最小内容幅より小さくしない。 */
  select{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px;max-width:100%;min-width:0}
  nav select{flex:1 1 100%}
  main{max-width:760px;margin:0 auto;padding:20px}
  table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;font-size:14px}
  th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  th{background:#eef2ff;font-size:13px}
  .en{font-weight:600}
  .ex{color:var(--sub);font-size:13px}
  .star{cursor:pointer;color:#d1d5db;font-size:17px;user-select:none}
  .star.on{color:var(--star)}
  #card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;padding:24px 24px 30px;text-align:center;margin:14px 0}
  #card .big{font-size:34px;font-weight:700}
  #card .pos{color:var(--sub);font-size:14px}
  #card .back{font-size:22px;font-weight:600;color:#1e40af}
  #card .ex{margin-top:12px;font-size:14px}
  .rowbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .rowbtns button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 18px;cursor:pointer}
  .q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0}
  .q .stem{font-size:24px;font-weight:700;margin-bottom:4px}
  .q .pos{color:var(--sub);font-size:13px;margin-bottom:12px}
  .choices{display:grid;gap:8px}
  .choice{text-align:left;border:1px solid var(--line);background:#fafafa;border-radius:8px;padding:10px 14px;cursor:pointer;font-size:15px;font-family:inherit}
  .choice.correct{background:#dcfce7;border-color:var(--ok);font-weight:600}
  .choice.wrong{background:#fee2e2;border-color:var(--ng)}
  /* 【項目15】2段階クイズ */
  .choices.two{grid-template-columns:1fr 1fr}
  .choice.self{text-align:center;font-size:16px;font-weight:600;padding:14px 10px}
  .choice.self.yes{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8}
  .choice.self.no{background:#fef2f2;border-color:#fca5a5;color:#b91c1c}
  .choice.none{background:#f8fafc;color:var(--sub);border-style:dashed}
  .stagenote{font-size:12px;color:var(--sub);margin:10px 0 0;line-height:1.6}
  .stagebanner{font-size:12.5px;background:#fffbeb;border:1px solid #fcd34d;color:#b45309;border-radius:8px;padding:7px 11px;margin:0 0 10px;line-height:1.6}
  .fb{margin-top:10px;font-size:14px;display:none}
  .meta{color:var(--sub);font-size:13px}
  .empty{color:var(--sub);text-align:center;margin-top:60px}
  .kind{display:inline-block;font-size:11px;border-radius:10px;padding:1px 7px;border:1px solid var(--line);background:#f1f5f9;color:var(--sub);white-space:nowrap}
  .kind.ph{background:#ede9fe;border-color:#c4b5fd;color:#5b21b6}
  .en.ph{color:#5b21b6}
  #card .big.ph{font-size:26px}
  .cardband{position:absolute;left:0;right:0;bottom:0;height:12px;display:flex;flex-direction:column}
  .cardband>i{display:block;flex:1;min-height:0}
  .tr{display:inline-block;font-size:10.5px;border-radius:8px;padding:0 6px;margin-left:4px;border:1px solid;vertical-align:1px;white-space:nowrap}
  .tr.vt{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8}
  .tr.vi{background:#fef2f2;border-color:#fca5a5;color:#b91c1c}
  .tr.both{background:#f5f3ff;border-color:#c4b5fd;color:#6d28d9}
  /* 【項目27】訳語の中の品詞・自他ラベル (名)(動)(自)(他) */
  .jl{display:inline-block;font-size:10.5px;border-radius:6px;padding:0 5px;margin-right:3px;border:1px solid var(--line);background:#f1f5f9;color:var(--sub);vertical-align:1.5px}
  /* 【項目26】同じ綴りで別品詞の項目があることを示す */
  .homo{display:inline-block;font-size:10.5px;border-radius:8px;padding:0 6px;margin-left:4px;border:1px solid #fcd34d;background:#fffbeb;color:#b45309;vertical-align:1px;white-space:nowrap}
  .poslegend{display:flex;flex-wrap:wrap;gap:5px 12px;justify-content:center;margin:8px 0 0;font-size:11.5px;color:var(--sub)}
  .poslegend .sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px}
  .q .stem.ph{font-size:20px}
  /* 長文タブ */
  .pwrap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:6px}
  .ptitle{font-size:19px;font-weight:700;margin:0 0 2px}
  .ptheme{color:var(--sub);font-size:13px;margin-bottom:12px}
  .ptext{font-size:15.5px;line-height:1.85}
  .ptext p{margin:0 0 13px}
  mark.tw{background:var(--mark);border-radius:3px;padding:0 2px;font-weight:600;color:#92400e}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}
  .chip{font-size:12px;border:1px solid var(--line);border-radius:12px;padding:2px 10px;background:#f8fafc;color:var(--sub)}
  .chip.hit{background:#dcfce7;border-color:var(--ok);color:#166534}
  .chip.hit::before{content:"\2713 ";font-weight:700}
  .chip.phc{border-style:dashed}
  .pja{color:#374151;font-size:14px;white-space:pre-wrap;display:none;border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
  .pjbtn{font-size:12px;color:var(--accent);background:none;border:none;cursor:pointer;padding:0;margin-top:12px}
  .pq{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
  .pq .stem{font-weight:600;margin-bottom:8px}
  .pq .expl{display:none;margin-top:8px;font-size:14px;color:#374151;border-top:1px dashed var(--line);padding-top:8px}
  .pq .reveal{font-size:12px;color:var(--accent);background:none;border:none;cursor:pointer;padding:0;margin-top:6px}
  .hublink{display:inline-block;font-size:12px;color:#6b7280;text-decoration:none;margin-bottom:6px}
  .hublink:hover{text-decoration:underline}
</style>
</head>
<body>
<header>
  <a class="hublink" id="hublink" href="/">&larr; ポータル一覧</a>
  <h1>TOEIC 単語ドリル</h1>
  <nav>
    <button id="m_list" class="active" onclick="setMode('list')">一覧</button>
    <button id="m_card" onclick="setMode('card')">カード</button>
    <button id="m_quiz" onclick="setMode('quiz')">クイズ</button>
    <button id="m_passage" onclick="setMode('passage')">長文</button>
    <select id="daySel" onchange="onRangeChange()"></select>
    <select id="typeSel" onchange="onRangeChange()">
      <option value="all">単語＋句表現</option>
      <option value="word">単語のみ</option>
      <option value="phrase">句表現のみ</option>
    </select>
  </nav>
</header>
<main id="content"><p class="empty">読み込み中…</p></main>
<script>
window.__VOCAB = [];
window.__addVocab = function(v){
  for(var i=0;i<window.__VOCAB.length;i++){ if(window.__VOCAB[i].date===v.date) return; }
  window.__VOCAB.push(v);
};
window.__PASSAGES = [];
window.__addPassage = function(p){
  for(var i=0;i<window.__PASSAGES.length;i++){ if(window.__PASSAGES[i].date===p.date) return; }
  window.__PASSAGES.push(p);
};

function loadScript(src){
  return new Promise(function(res){
    var s=document.createElement('script');
    s.src=src; s.onload=res; s.onerror=res;
    document.head.appendChild(s);
  });
}

// 単語(_all.js)と長文(_all.js)をまず1回で読み、最終日より後の分だけ個別に補完する
function probeSet(indexSrc, dayPrefix, arr, startY, startM, startD){
  return loadScript(indexSrc).then(function(){
    var last=null;
    arr.forEach(function(d){ if(!last||d.date>last) last=d.date; });
    var start=new Date(startY,startM,startD);
    if(last){ var p=last.split('-'); start=new Date(+p[0],+p[1]-1,+p[2]); start.setDate(start.getDate()+1); }
    var end=new Date(); end.setDate(end.getDate()+1);
    var ps=[];
    for(var d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
      var y=d.getFullYear(),m=('0'+(d.getMonth()+1)).slice(-2),dd=('0'+d.getDate()).slice(-2);
      ps.push(loadScript(dayPrefix+y+'-'+m+'-'+dd+'.js'));
    }
    return Promise.all(ps);
  });
}
function probe(){
  return Promise.all([
    probeSet('単語データ/_all.js','単語データ/VOCAB_',window.__VOCAB,2026,6,16),   // 2026-07-16
    probeSet('長文データ/_all.js','長文データ/PASSAGE_',window.__PASSAGES,2026,6,16) // 2026-07-16
  ]);
}

var daysData=[], passageDays=[], mode='list', cardIdx=0, cardBack=false, quizSet=[], quizIdx=0, quizOk=0;
// 【項目15】2段階クイズの状態。stage 1=自己申告, 2=選択肢。self は第1段階の答え（null/1/0）。
var quizStage=1, quizSelf=null, quizOpts=null, quizOptsIdx=-1;
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ---- 品詞別の色分け（項目9）----
// 単語の pos は "名"/"動"/"形" 等。複数品詞は "動/名" のように / 区切り。句表現は kind==='phrase'。
var POS_COLORS={'名':'#2563eb','代':'#2563eb','動':'#0d9488','形':'#d97706','副':'#7c3aed','前':'#db2777','接':'#0891b2','冠':'#64748b','助':'#64748b','間':'#64748b','数':'#64748b','句':'#7c3aed'};
var POS_LABEL={'名':'名詞','代':'代名詞','動':'動詞','形':'形容詞','副':'副詞','前':'前置詞','接':'接続詞','冠':'冠詞','助':'助動詞','間':'間投詞','数':'数詞','句':'句表現'};
// 品詞を配列に分解する。単語は "動/名" のように / 区切り。
// 句は【項目12】で pos が "動詞句" "形容詞句/副詞句" 等になる（旧データの "句" も許容）。
function posParts(w){
  var raw=String(w.pos||'').replace(/[（(][^）)]*[）)]/g,'');   // 括弧書きの補足を除く
  var parts=raw.split(/[\/・,、|]/).map(function(x){return x.trim();}).filter(Boolean);
  if(!parts.length) parts=[w.kind==='phrase'?'句':''];
  return parts;
}
function posColorOf(p){
  // "動詞句" は先頭一致で 動 の色を引く。ラベルは「〜句」をそのまま見せる。
  for(var k in POS_COLORS){
    if(p.indexOf(k)===0) return {c:POS_COLORS[k], lab:(/句$/.test(p)&&p!=='句')?p:POS_LABEL[k]};
  }
  return {c:'#9ca3af',lab:p||'その他'};
}
// 複数の色を左右に等分する背景を作る（1色ならそのまま塗る）
function splitBg(cs){
  if(!cs.length) return 'background:#9ca3af';
  if(cs.length===1) return 'background:'+cs[0];
  var seg=100/cs.length, stops=[];
  for(var i=0;i<cs.length;i++){ stops.push(cs[i]+' '+(seg*i)+'%'); stops.push(cs[i]+' '+(seg*(i+1))+'%'); }
  return 'background:linear-gradient(90deg,'+stops.join(',')+')';
}
/** カード下端の帯。
    単語 … 1段。複数品詞は左右に等分（項目9）
    句   … 上下2段。上=句であることを示す色、下=何句かの色（項目12）
    軸を変えることで「複数品詞」と「句の品詞」を見分けられる。 */
function cardBandHtml(w){
  var cs=posParts(w).map(function(p){return posColorOf(p).c;});
  if(w.kind==='phrase'){
    return '<div class="cardband">'
      +'<i style="'+splitBg([POS_COLORS['句']])+'"></i>'
      +'<i style="'+splitBg(cs)+'"></i></div>';
  }
  return '<div class="cardband"><i style="'+splitBg(cs)+'"></i></div>';
}
// カード集合に現れる品詞の凡例（色と名称の対応）
function posLegend(ws){
  var seen={},order=[];
  ws.forEach(function(w){ posParts(w).forEach(function(p){ var o=posColorOf(p); var key=o.lab; if(!seen[key]){seen[key]=o;order.push(key);} }); });
  if(!order.length) return '';
  var h='<div class="poslegend">'+order.map(function(key){
    var o=seen[key]; return '<span><span class="sw" style="background:'+o.c+'"></span>'+esc(o.lab)+'</span>';
  }).join('');
  if(ws.some(function(w){return w.kind==='phrase';})){
    h+='<span style="opacity:.8">句表現は帯が上下2段（上=句・下=品詞）</span>';
  }
  return h+'</div>';
}

/** 【項目13】動詞の自他。trans は "vt" / "vi" / "vt/vi"。 */
var TRANS_LABEL={vt:'他',vi:'自','vt/vi':'他自'};
var TRANS_TITLE={vt:'他動詞（目的語を直接とる）',vi:'自動詞（目的語を直接とらない。前置詞が必要）','vt/vi':'他動詞・自動詞の両用'};
/** trans の表記ゆれを吸収する。データ側の正しい形は "vt/vi" だが、
    "vi/vt" と書かれても表示が黙って消えないようにする（検査は tests 側で厳密に見る）。 */
function normTrans(t){
  t=String(t||'').trim().toLowerCase();
  return (t==='vi/vt')?'vt/vi':t;
}
function transBadge(w){
  var t=normTrans(w.trans); if(!t||!TRANS_LABEL[t]) return '';
  var cls=(t==='vt/vi')?'both':t;
  return '<span class="tr '+cls+'" title="'+esc(TRANS_TITLE[t])+'">'+TRANS_LABEL[t]+'</span>';
}
/** 一覧・カード・クイズで共通に使う「品詞（＋自他）」の表示 */
function posText(w){ return esc(w.pos||'')+transBadge(w); }

/** 【項目26】語の同一性は「見出し＋品詞」で決める。
    secure(形:安全な) と secure(動:確保する) のように、同じ綴りで品詞も語義も違う語がある。
    見出しだけを鍵にすると、一覧・カード・クイズの重複除去で片方が黙って消え、
    正誤履歴と★も2語で共有されてしまう。表示・履歴・重複除去のすべてをこの鍵で揃える。 */
function normPos(w){ return String(w.pos||'').replace(/[（(][^）)]*[）)]/g,'').trim(); }
function keyOf(w){ return w.en+'|'+normPos(w); }

/** 【項目32】訳語を「語義の集合」に分解する。
    英→日クイズは、訳が同じ2語を選択肢に並べると**正解が一意に決まらない**。
    たとえば deal with A「～に対処する」と handle A「～を処理する」を並べると、
    日本語だけを見て英語を復元することはできない。
    そこで誤答候補を選ぶ前に、語義が重なる語を外す。

    比較のために落とすも:
      括弧の補足 … 「（利息などが）発生する」→「発生する」
      〜 / A / B … 目的語のプレースホルダ
      助詞       … 「を対処する」と「に対処する」を同じ語義とみなすため
    助詞まで落とすのは、意図的に**過剰に**寄せている。誤答候補は余っているので、
    取りこぼす（紛らわしい語を出してしまう）方が害が大きい。 */
/** 【項目27】訳語を表示用の HTML にする。
    規約上、**半角かっこは品詞・自他のラベル専用**（補足は全角かっこ）なので、
    機械的に見分けてラベルだけ小さく見せられる。意味の本体を読みやすくするため。 */
function jaHtml(ja){
  return esc(String(ja||'')).replace(/\((名|動|形|副|前|接|自|他)\)/g,'<span class="jl">$1</span>');
}

var _senseCache={};
function jaSenses(ja){
  ja=String(ja||'');
  if(_senseCache[ja])return _senseCache[ja];
  var body=ja.replace(/[（(][^）)]*[）)]/g,'');
  var out={};
  body.split(/[、;；,，／]|\s\/\s/).forEach(function(p){
    var t=p.replace(/[〜～]/g,'').replace(/\bA\b|\bB\b/g,'')
           .replace(/[をにがはへとのも\s]/g,'').trim();
    if(t)out[t]=1;
  });
  return _senseCache[ja]=out;
}
function sensesOverlap(jaA,jaB){
  var a=jaSenses(jaA), b=jaSenses(jaB);
  for(var k in a){ if(b[k])return true; }
  return false;
}

/** 読み込み済みデータ中で綴りが重複している見出しの集合（表示の注意喚起用） */
var HOMO={};
function buildHomo(){
  var n={}; HOMO={};
  allItemsRaw().forEach(function(w){ n[w.en]=(n[w.en]||0)+1; });
  for(var k in n){ if(n[k]>1) HOMO[k]=1; }
}
function homoBadge(w){
  return HOMO[w.en] ? '<span class="homo" title="同じ綴りで品詞の違う項目が別の日にあります。別の語として扱います">同綴</span>' : '';
}

/** 旧形式（見出しだけを鍵にした）localStorage を1度だけ移行する。
    同綴りが複数ある場合、履歴を積めたのは先に出題された方だけなので、最も古い項目へ引き継ぐ。 */
var KEYVER='toeic_vocab_keyver';
function migrateKeys(){
  try{
    if(localStorage.getItem(KEYVER)==='2') return;
    var oldest={};
    daysData.forEach(function(d){ (d.items||[]).forEach(function(w){ if(!oldest[w.en]) oldest[w.en]=w; }); });
    [[HIST,saveHist],[WEAK,saveWeak]].forEach(function(pair){
      var store=pair[0], save=pair[1], moved={};
      Object.keys(store).forEach(function(k){
        if(k.indexOf('|')>=0) return;              // すでに新形式
        var w=oldest[k];
        if(!w){ moved[k]=store[k]; return; }        // 該当語が消えている場合はそのまま残す
        moved[keyOf(w)]=store[k];
      });
      Object.keys(store).forEach(function(k){ delete store[k]; });
      Object.keys(moved).forEach(function(k){ store[k]=moved[k]; });
      save();
    });
    localStorage.setItem(KEYVER,'2');
  }catch(e){}
}

var WEAK={};
try{WEAK=JSON.parse(localStorage.getItem('toeic_vocab_weak')||'{}');}catch(e){WEAK={};}
function saveWeak(){try{localStorage.setItem('toeic_vocab_weak',JSON.stringify(WEAK));}catch(e){}}
function toggleWeak(w,el){ if(WEAK[w]){delete WEAK[w];el.classList.remove('on');}else{WEAK[w]=1;el.classList.add('on');} saveWeak(); }

// ---- 項目10: 復習ミックス（今日／n_1日前／n_2日前／よく間違える語）----
// 調整用の定数。n は「今日と合わせて最大3日次」の制約内（過去2日まで）。
// 【項目14】出題数の上限は撤廃。対象プールの全件を出す。
// 群ごとの重み付け(QUIZ_TARGET)は不要になったので、代わりに「出題順」を規定する。
var QUIZ_N1=1;         // n_1: 1日前
var QUIZ_N2=3;         // n_2: 3日前
var QUIZ_M=5;          // 「よく間違える」判定に見る直近の出題回数
var QUIZ_P=2;          // 直近M回のうちこの回数以上間違えたら対象
// 【項目17】「回答数が少ない語」群の上限。
// 他の群（今日/n日前）は日付で母集団が絞られ、miss も該当語だけなので自然に有限。
// この群だけは母集団が「全期間の全語」で、初期は全語が0回なので上限が無いと際限なく増える。
var QUIZ_FEW=10;
var QUIZ_ORDER=['today','d1','d3','miss','few'];  // 復習ミックスの出題順。群の中はシャッフルする

// 語ごとの直近正誤履歴（1=正解, 0=誤答）。直近10件まで保持。
var HIST={};
try{HIST=JSON.parse(localStorage.getItem('toeic_vocab_hist')||'{}');}catch(e){HIST={};}
function saveHist(){try{localStorage.setItem('toeic_vocab_hist',JSON.stringify(HIST));}catch(e){}}
function recordResult(en,ok){ var a=HIST[en]||[]; a.push(ok?1:0); if(a.length>10)a=a.slice(-10); HIST[en]=a; saveHist(); }
function missOften(en){ var a=(HIST[en]||[]).slice(-QUIZ_M); var wrong=0; a.forEach(function(x){if(x===0)wrong++;}); return wrong>=QUIZ_P; }

/** 【項目15】第1段階の自己申告（1=わかる, 0=わからない）。HIST と必ず同じ回数だけ積む。
    「わかると思ったが違った（思い違い）」を後から数えられるようにするための記録。
    HIST と足並みを揃えるため、記録は必ず recordResult と同時に行う。 */
var SELF={};
try{SELF=JSON.parse(localStorage.getItem('toeic_vocab_self')||'{}');}catch(e){SELF={};}
function saveSelf(){try{localStorage.setItem('toeic_vocab_self',JSON.stringify(SELF));}catch(e){}}
/** 正誤と自己申告を1回分まとめて記録する。片方だけ積むと対応が崩れるので、必ずこれを通す。 */
function recordAnswer(key,ok,self){
  recordResult(key,ok);
  var a=SELF[key]||[]; a.push(self?1:0); if(a.length>10)a=a.slice(-10); SELF[key]=a; saveSelf();
}

function todayDateStr(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function dayItemsOn(dateStr){ var d=daysData.filter(function(x){return x.date===dateStr;})[0]; return d?(d.items||[]).slice():[]; }
function qToday(){ return dayItemsOn(todayDateStr()); }
function qAgo(n){ var dt=new Date(); dt.setDate(dt.getDate()-n); return dayItemsOn(dt.getFullYear()+'-'+('0'+(dt.getMonth()+1)).slice(-2)+'-'+('0'+dt.getDate()).slice(-2)); }
function qMiss(){ return allItemsRaw().filter(function(w){return missOften(keyOf(w));}); }
/** 語の総回答回数（履歴の件数）。未回答は0。 */
function answerCount(en){ return (HIST[en]||[]).length; }
/** 【項目17】回答数が少ない語。未回答を最優先に、少ない順で QUIZ_FEW 件まで。
    同数のときはランダムに散らす（毎回同じ語が並ばないように）。

    exclude（既に他の群に入った語の集合）を先に除いてから選ぶ。
    今日の語は当日どれも0回なので、除外しないと上位を独占し、
    重複除去の結果この群が空になってしまう。 */
function qFew(exclude){
  exclude=exclude||{};
  return shuffleArr(allItemsRaw())
    .filter(function(w){ return !exclude[keyOf(w)]; })
    .sort(function(a,b){ return answerCount(keyOf(a))-answerCount(keyOf(b)); })
    .slice(0, QUIZ_FEW);
}
/** 今日/n日前/よく間違える に含まれる語の集合（few群の除外用） */
function qCoveredSet(){
  var m={};
  [qToday(), qAgo(QUIZ_N1), qAgo(QUIZ_N2), qMiss()].forEach(function(list){
    list.forEach(function(w){ m[keyOf(w)]=1; });
  });
  return m;
}
function shuffleArr(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }

function setMode(m){
  mode=m;
  ['list','card','quiz','passage'].forEach(function(x){document.getElementById('m_'+x).classList.toggle('active',x===m);});
  cardIdx=0;cardBack=false;
  if(m==='quiz')buildQuiz();
  render();
}

// 単語(kind:'word')と句表現(kind:'phrase')を1本の items 配列に正規化する
function buildItems(d){
  var a=[];
  (d.words||[]).forEach(function(w){var o={};for(var k in w)o[k]=w[k];o.kind='word';a.push(o);});
  (d.phrases||[]).forEach(function(p){var o={};for(var k in p)o[k]=p[k];o.kind='phrase';o.pos=o.pos||'句';a.push(o);});
  d.items=a; return d;
}
function typeOf(){var e=document.getElementById('typeSel');return e?e.value:'all';}
function filterKind(a){var t=typeOf();return t==='all'?a:a.filter(function(x){return x.kind===t;});}
function onRangeChange(){cardIdx=0;cardBack=false;if(mode==='quiz')buildQuiz();render();}

function selDates(){
  var v=document.getElementById('daySel').value;
  if(v==='all')return daysData;
  // 【項目16】「よく間違える」= missOften（直近M回でP回以上誤答）に統一。
  // ★による手動登録は明示的な意思表示なので残し、和集合にする。
  if(v==='weak')return [{date:'よく間違える',items:allItemsRaw().filter(function(w){return missOften(keyOf(w))||WEAK[keyOf(w)];})}];
  if(v==='review')return reviewDays();
  if(v==='qmix')return [
    {date:'今日', items:qToday()},
    {date:QUIZ_N1+'日前', items:qAgo(QUIZ_N1)},
    {date:QUIZ_N2+'日前', items:qAgo(QUIZ_N2)},
    {date:'よく間違える', items:qMiss()},
    {date:'回答数が少ない', items:qFew(qCoveredSet())}
  ];
  return daysData.filter(function(d){return d.date===v;});
}
function allItemsRaw(){var a=[];daysData.forEach(function(d){a=a.concat(d.items||[]);});return a;}
function allWords(){return filterKind(allItemsRaw());}
function reviewDays(){
  // 今日 + 1/3/7/14/30日前 の回を復習対象にする
  var t=new Date(), targets={};
  [0,1,3,7,14,30].forEach(function(n){
    var d=new Date(t);d.setDate(d.getDate()-n);
    targets[d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)]=1;
  });
  var r=daysData.filter(function(d){return targets[d.date];});
  return r.length?r:daysData.slice(-1);
}
function pool(){
  var a=[];selDates().forEach(function(d){a=a.concat(d.items||[]);});
  a=filterKind(a);
  var seen={},out=[];
  a.forEach(function(x){ var k=keyOf(x); if(!seen[k]){seen[k]=1;out.push(x);} });
  return out;
}

function render(){
  var c=document.getElementById('content');
  if(mode==='passage'){ renderPassage(); return; }
  if(!daysData.length){c.innerHTML='<p class="empty">まだ単語データがありません。</p>';return;}
  var ws=pool();
  if(mode==='list'){
    var nw=ws.filter(function(x){return x.kind!=='phrase';}).length, np=ws.length-nw;
    var h='<p class="meta">単語'+nw+' ／ 句表現'+np+'（計'+ws.length+'）　★をクリックすると手動登録（「よく間違える＋★」で出題）</p>';
    h+='<table><tr><th></th><th>種別</th><th>見出し</th><th>品詞</th><th>意味</th><th>例文・補足</th></tr>';
    ws.forEach(function(w){
      var ph=(w.kind==='phrase');
      h+='<tr><td><span class="star'+(WEAK[keyOf(w)]?' on':'')+'" onclick="toggleWeak(\''+esc(keyOf(w)).replace(/'/g,"\\'")+'\',this)">★</span></td>'
        +'<td><span class="kind'+(ph?' ph':'')+'">'+(ph?'句表現':'単語')+'</span></td>'
        +'<td class="en'+(ph?' ph':'')+'">'+esc(w.en)+homoBadge(w)+'</td><td>'+posText(w)+'</td><td>'+jaHtml(w.ja)+'</td>'
        +'<td>'+esc(w.ex||'')+'<div class="ex">'+esc(w.exJa||'')+(w.note?' ／ '+esc(w.note):'')+'</div></td></tr>';
    });
    c.innerHTML=h+'</table>';
  } else if(mode==='card'){
    if(!ws.length){c.innerHTML='<p class="empty">対象の単語がありません。</p>';return;}
    if(cardIdx>=ws.length)cardIdx=0;
    var w=ws[cardIdx];
    var h='<p class="meta">'+(cardIdx+1)+' / '+ws.length+'（カードをクリックで表裏切替）</p>';
    h+='<div id="card" onclick="cardBack=!cardBack;render()">';
    if(!cardBack){ h+='<div class="big'+(w.kind==='phrase'?' ph':'')+'">'+esc(w.en)+'</div><div class="pos">'+homoBadge(w)+'<span class="kind'+(w.kind==='phrase'?' ph':'')+'">'+(w.kind==='phrase'?'句表現':'単語')+'</span> '+posText(w)+'</div>'; }
    else{ h+='<div class="back">'+jaHtml(w.ja)+'</div><div class="ex">'+esc(w.ex||'')+'<br>'+esc(w.exJa||'')+(w.note?'<br>'+esc(w.note):'')+'</div>'; }
    h+=cardBandHtml(w);
    h+='</div><div class="rowbtns">'
      +'<button onclick="cardIdx=Math.max(0,cardIdx-1);cardBack=false;render()">← 前へ</button>'
      +'<button onclick="cardIdx=(cardIdx+1)%'+ws.length+';cardBack=false;render()">次へ →</button>'
      +'<button onclick="shuffleCards()">シャッフル</button></div>';
    h+=posLegend(ws);
    c.innerHTML=h;
  } else {
    renderQuiz();
  }
}
var shuffled=null;
function shuffleCards(){
  selDates().forEach(function(d){if(d.items)d.items.sort(function(){return Math.random()-0.5;});});
  cardIdx=0;cardBack=false;render();
}

var QUIZ_GLABEL={today:'今日', d1:QUIZ_N1+'日前', d3:QUIZ_N2+'日前', miss:'よく間違える', few:'回答数が少ない'};
function buildQuiz(){
  var v=document.getElementById('daySel').value;
  var chosen=[], seen={};
  if(v==='qmix'){
    // 【項目14】全件を出す。QUIZ_ORDER の順に群を並べ、群の中だけシャッフルする。
    // どの群から出ているかを quizGroup に持たせ、進捗表示に使う。
    var g={today:filterKind(qToday()), d1:filterKind(qAgo(QUIZ_N1)), d3:filterKind(qAgo(QUIZ_N2)),
           miss:filterKind(qMiss()), few:filterKind(qFew(qCoveredSet()))};
    QUIZ_ORDER.forEach(function(k){
      // few 群は qFew() が回答数の少ない順に並べているので、その順を保つ
      // （途中でやめても「最も測れていない語」から消化できる）。他の群は群内をシャッフル。
      var list = (k==='few') ? (g[k]||[]) : shuffleArr(g[k]||[]);
      list.forEach(function(w){
        var kk=keyOf(w);
        if(!seen[kk]){ seen[kk]=1; var o={};for(var p in w)o[p]=w[p]; o.quizGroup=k; chosen.push(o); }
      });
    });
  } else {
    chosen=shuffleArr(pool());
  }
  quizSet=chosen; quizIdx=0; quizOk=0; resetStage();
}
function resetStage(){ quizStage=1; quizSelf=null; quizOpts=null; quizOptsIdx=-1; }
function nextQuestion(){ quizIdx++; resetStage(); render(); }
function renderQuiz(){
  var c=document.getElementById('content');
  if(!quizSet.length){c.innerHTML='<p class="empty">対象の単語がありません。範囲を変えてください。</p>';return;}
  if(quizIdx>=quizSet.length){
    resetStage();
    c.innerHTML='<div class="q"><div class="stem">結果: '+quizOk+' / '+quizSet.length+'</div>'
      +'<p class="stagenote">「わかる」と答えて選択肢も正解したものだけを正答として数えています。</p>'
      +'<div class="rowbtns"><button onclick="buildQuiz();render()">もう一度</button></div></div>';
    return;
  }
  var w=quizSet[quizIdx];
  // 全件出題は1回が長くなるので、いまどの群を解いているかと、その群の何問目かを示す
  var qmixNote='';
  if(document.getElementById('daySel').value==='qmix'){
    var gk=w.quizGroup, gAll=quizSet.filter(function(x){return x.quizGroup===gk;});
    var gIdx=0; for(var i=0;i<=quizIdx;i++){ if(quizSet[i].quizGroup===gk) gIdx++; }
    qmixNote='<p class="meta" style="margin-top:-4px">'
      +'<b>'+esc(QUIZ_GLABEL[gk]||'')+'</b> '+gIdx+' / '+gAll.length
      +(gk==='few'?'（この語の回答 '+answerCount(keyOf(w))+' 回）':'')
      +' ｜ 復習ミックス: '+QUIZ_ORDER.map(function(k){
          var n=quizSet.filter(function(x){return x.quizGroup===k;}).length;
          return QUIZ_GLABEL[k]+(n?'('+n+')':'(0)');
        }).join(' → ')+'</p>';
  }
  var ph=(w.kind==='phrase');
  var head='<p class="meta">'+(quizIdx+1)+' / '+quizSet.length+' ｜ 正答 '+quizOk
    +' ｜ 第'+quizStage+'段階</p>'+qmixNote;
  var stem='<div class="stem'+(ph?' ph':'')+'">'+esc(w.en)+'</div>';
  var posline=function(tail){
    return '<div class="pos">'+homoBadge(w)+'<span class="kind'+(ph?' ph':'')+'">'+(ph?'句表現':'単語')
      +'</span> '+posText(w)+' ｜ '+tail+'</div>';
  };

  if(quizStage===1){ renderStage1(c,w,head,stem,posline); }
  else{ renderStage2(c,w,head,stem,posline); }
}

/** 【項目15】第1段階: 選択肢を見せる前に「わかる／わからない」を自己申告させる。
    4択だけだと消去法で当たってしまい、思い出せていないのに正答率が上がる。
    先に自己申告させることで、その水増しを切り離す。 */
function renderStage1(c,w,head,stem,posline){
  var h=head+'<div class="q">'+stem+posline('意味を思い出せますか')
    +'<div class="choices two">'
    +'<button class="choice self yes" data-self="1">わかる</button>'
    +'<button class="choice self no" data-self="0">わからない</button>'
    +'</div>'
    +'<p class="stagenote">「わからない」を押しても、このあと選択肢と解説は表示されます。'
    +'その回答は記録に入らないので、正直に押してください。</p></div>';
  c.innerHTML=h;
  c.querySelectorAll('.choice').forEach(function(b){
    b.onclick=function(){
      quizSelf=(b.dataset.self==='1')?1:0;
      // 「わからない」はこの時点で不正解が確定する。第2段階は正解を見るための表示。
      if(quizSelf===0) recordAnswer(keyOf(w),false,0);
      quizStage=2; render();
    };
  });
}

/** 【項目15】第2段階: 4択＋「思い浮かべた訳が選択肢に無い」の5択。
    5つ目があることで、第1段階で「わかる」と答えたのに該当が無い＝思い違い、を拾える。 */
function renderStage2(c,w,head,stem,posline){
  var opts=quizOptions(w);
  var rec=(quizSelf===1);   // 記録するのは「わかる」を選んだときだけ
  var h=head+'<div class="q">'+stem+posline('意味を選んでください');
  if(!rec){
    h+='<p class="stagebanner">「わからない」を選んだので、この問題は<b>不正解として記録済み</b>です。'
      +'ここから先の回答は記録に入りません。正解を確認してください。</p>';
  }
  h+='<div class="choices">';
  // 正解判定は keyOf で行う。同綴りの別品詞を「正解扱い」にしないため。
  opts.forEach(function(o){h+='<button class="choice" data-ok="'+(keyOf(o)===keyOf(w)?1:0)+'">'+jaHtml(o.ja)+'</button>';});
  h+='<button class="choice none" data-ok="0" data-none="1">思い浮かべた訳が選択肢に無い</button>';
  h+='</div><div class="fb" id="fb"></div></div>';
  c.innerHTML=h;
  c.querySelectorAll('.choice').forEach(function(b){
    b.onclick=function(){
      if(document.getElementById('fb').style.display==='block')return;
      var pick=(b.dataset.ok==='1');
      var none=(b.dataset.none==='1');
      c.querySelectorAll('.choice').forEach(function(x){x.disabled=true;if(x.dataset.ok==='1')x.classList.add('correct');});
      if(!pick)b.classList.add('wrong');

      // 【項目15】判定表:
      //   わかる  + 正解            → ○（記録する）
      //   わかる  + 不正解/該当なし → ✗ 思い違い（記録する）
      //   わからない + 何を選んでも → ✗（第1段階で記録済み。ここでは記録しない）
      var final=rec&&pick;
      if(rec) recordAnswer(keyOf(w),pick,1);
      if(final)quizOk++;

      var head2;
      if(final){ head2='<b style="color:var(--ok)">正解</b>'; }
      else if(rec){
        head2='<b style="color:var(--ng)">不正解</b>'
          +(none?'（思い浮かべた訳が選択肢にありませんでした）':'（思い違い）');
      }else{
        head2='<b style="color:var(--ng)">不正解</b>（わからないと申告）'
          +(pick?' ／ 選択肢では正解を選べました':'');
      }
      head2+=(missOften(keyOf(w))?' <span class="meta">よく間違える語</span>':'');

      var fb=document.getElementById('fb');
      fb.style.display='block';
      fb.innerHTML=head2
        +'<br>'+esc(w.ex||'')+'<br><span class="meta">'+esc(w.exJa||'')+(w.note?' ／ '+esc(w.note):'')+'</span>'
        +'<div class="rowbtns" style="justify-content:flex-start;margin-top:8px"><button onclick="nextQuestion()">次の問題 →</button></div>';
    };
  });
}

/** 第2段階の選択肢。設問ごとに1度だけ作って使い回す（再描画で並びが変わらないように）。 */
function quizOptions(w){
  if(quizOptsIdx===quizIdx&&quizOpts)return quizOpts;
  var all=allItemsRaw().filter(function(x){return x.en!==w.en&&x.ja!==w.ja;});
  // 【項目32】語義が重なる語は誤答に使わない。正解が一意に決まらなくなるため。
  var base=all.filter(function(x){return !sensesOverlap(x.ja,w.ja);});
  // 候補が枯れたら緩める。「紛らわしい選択肢が出る」より「出題できない」方が困る。
  if(base.length<3)base=all;
  var same=base.filter(function(x){return x.kind===w.kind;});   // 誤答は同じ種別から作る（単語の意味に句表現が混ざらないように）
  var others=(same.length>=3?same:base).slice();
  others.sort(function(){return Math.random()-0.5;});
  var opts=[w].concat(others.slice(0,3));
  opts.sort(function(){return Math.random()-0.5;});
  quizOpts=opts; quizOptsIdx=quizIdx;
  return opts;
}

// ---- 長文タブ ----
function currentPassageDate(){
  var v=document.getElementById('daySel').value;
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  if(!passageDays.length) return null;
  var _t=new Date(), _ts=_t.getFullYear()+'-'+('0'+(_t.getMonth()+1)).slice(-2)+'-'+('0'+_t.getDate()).slice(-2);
  var _av=passageDays.filter(function(x){return x.date<=_ts;}); // 未来日付は当日まで隠す
  return (_av.length? _av[_av.length-1] : passageDays[0]).date; // 全期間/苦手/復習は「今日以前の最新回」を表示
}
// カバレッジ照合キー: 見出しから最も長い語を取り出し先頭5文字で前方一致を見る
// (句表現は be / A / B / do / -ing などの記号を含むため、内容語で照合する)
function covKey(t){
  var toks=String(t).toLowerCase().replace(/-ing/g,' ').split(/[^a-z']+/).filter(function(x){return x;});
  var best='';
  toks.forEach(function(x){ if(x.length>best.length) best=x; });
  return best.slice(0,5);
}
function markPassage(text){
  // [[surface]] を目標語ハイライトに変換。段落は空行区切り。
  var html=esc(text).replace(/\[\[([^\]]+)\]\]/g,'<mark class="tw">$1</mark>');
  return html.split(/\n\s*\n/).map(function(p){return '<p>'+p.replace(/\n/g,'<br>')+'</p>';}).join('');
}
function renderPassage(){
  var c=document.getElementById('content');
  if(!passageDays.length){c.innerHTML='<p class="empty">長文データがまだありません。日次タスク(daily-toeic-vocab)で生成されます。</p>';return;}
  var date=currentPassageDate();
  var p=passageDays.filter(function(x){return x.date===date;})[0];
  var note='';
  if(!p){ p=passageDays[passageDays.length-1]; note='<p class="meta">選択した日付の長文はありません。最新回('+esc(p.date)+')を表示しています。</p>'; }
  var plain=String(p.passage).replace(/\[\[|\]\]/g,'');
  var h=note+'<div class="pwrap">';
  h+='<h2 class="ptitle">'+esc(p.title||'今日の長文')+'</h2>';
  h+='<div class="ptheme">'+esc(p.date)+(p.theme?' ／ '+esc(p.theme):'')+(p.level?' ／ '+esc(p.level)+'点レベル':'')+'</div>';
  // 使用語チェックリスト(全語カバーの確認)
  var cov=[];
  (p.words||[]).forEach(function(w){cov.push({t:w,ph:false});});
  (p.phrases||[]).forEach(function(w){cov.push({t:w,ph:true});});
  if(cov.length){
    h+='<div class="chips">';
    cov.forEach(function(it){
      var key=covKey(it.t);
      var hit=key.length>0&&plain.toLowerCase().indexOf(key)>=0;
      h+='<span class="chip'+(hit?' hit':'')+(it.ph?' phc':'')+'">'+esc(it.t)+'</span>';
    });
    h+='</div>';
  }
  h+='<div class="ptext">'+markPassage(p.passage)+'</div>';
  if(p.passageJa){
    h+='<button class="pjbtn" onclick="var e=document.getElementById(\'pja\');e.style.display=e.style.display===\'block\'?\'none\':\'block\'">全文の和訳を表示 / 隠す</button>';
    h+='<div class="pja" id="pja">'+esc(p.passageJa)+'</div>';
  }
  (p.questions||[]).forEach(function(it,qi){
    var qid='pq'+qi;
    h+='<div class="pq" id="'+qid+'"><div class="stem">Q'+(qi+1)+'. '+esc(it.q)+'</div><div class="choices">';
    it.choices.forEach(function(ch,ci){
      h+='<button class="choice" data-q="'+qid+'" data-c="'+ci+'" data-a="'+it.answer+'">'+String.fromCharCode(65+ci)+'. '+esc(ch)+'</button>';
    });
    h+='</div><button class="reveal" data-show="'+qid+'">解答・解説を見る</button>';
    h+='<div class="expl" id="'+qid+'_e">'+esc(it.expl||'')+'</div></div>';
  });
  h+='</div>';
  c.innerHTML=h;
  c.querySelectorAll('.pq .choice').forEach(function(btn){
    btn.onclick=function(){
      var box=document.getElementById(btn.dataset.q); if(box.dataset.done)return;
      box.dataset.done='1'; var ans=+btn.dataset.a;
      box.querySelectorAll('.choice').forEach(function(b){b.disabled=true;if(+b.dataset.c===ans)b.classList.add('correct');});
      if(+btn.dataset.c!==ans)btn.classList.add('wrong');
      document.getElementById(btn.dataset.q+'_e').style.display='block';
    };
  });
  c.querySelectorAll('.pq .reveal[data-show]').forEach(function(btn){
    btn.onclick=function(){
      var box=document.getElementById(btn.dataset.show);
      if(!box.dataset.done){box.dataset.done='1';box.querySelectorAll('.choice').forEach(function(b){var ans=+b.dataset.a;b.disabled=true;if(+b.dataset.c===ans)b.classList.add('correct');});}
      document.getElementById(btn.dataset.show+'_e').style.display='block';
    };
  });
}
